# ─── Application ───────────────────────────────────────
spring.application.name=gate-prediction-backend

# ─── MySQL Database ────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── Server ────────────────────────────────────────────
server.port=${PORT:8081}

# ─── ML Service URL ────────────────────────────────────
ml.service.url=${ML_SERVICE_URL}

# ─── JWT ───────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ─── Gemini AI ─────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}