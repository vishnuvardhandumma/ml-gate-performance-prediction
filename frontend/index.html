<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATE Prediction — Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      color: #38bdf8;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo p {
      color: #64748b;
      font-size: 14px;
      margin-top: 6px;
    }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: #64748b;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .message.success {
      background: #064e3b;
      color: #6ee7b7;
      display: block;
    }

    .message.error {
      background: #450a0a;
      color: #fca5a5;
      display: block;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">
      <h1>GATE Predictor</h1>
      <p>ML-Based Performance Prediction System</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="login()">Login</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Vishnu Kumar" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" />
      </div>
      <button class="btn" onclick="register()">Create Account</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
const API = 'https://observant-friendship-production.up.railway.app/api/auth';
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0) === (tab === 'login'));
      });
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      hideMessage();
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        let data = null;
        try {
          data = await res.json();
        } catch (e) {
          data = null;
        }

        if (res.ok) {
          localStorage.setItem('token', data?.token || '');
          localStorage.setItem('name', data?.name || email);
          localStorage.setItem('email', data?.email || email);
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
          showMessage(data?.message || 'Login failed', 'error');
        }
      } catch (e) {
        showMessage('Cannot connect to server. Is Spring Boot running?', 'error');
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!name || !email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      try {
        const res = await fetch(`${API}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        let data = null;
        try {
          data = await res.json();
        } catch (e) {
          data = null;
        }

        if (res.ok) {
          showMessage('Account created! Please login to continue.', 'success');
          setTimeout(() => switchTab('login'), 1500);
        } else {
          showMessage(data?.message || 'Registration failed', 'error');
        }
      } catch (e) {
        showMessage('Cannot connect to server. Is Spring Boot running?', 'error');
      }
    }
  </script>
</body>

</html>
